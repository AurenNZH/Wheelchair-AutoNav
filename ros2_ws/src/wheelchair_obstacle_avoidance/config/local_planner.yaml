nav2_planner:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["LocalAvoidance"]
    LocalAvoidance:
      plugin: "smac_planner/SmacPlanner"
      tolerance: 0.2
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 100000
      max_planning_time_ms: 30.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 36
      minimum_turning_radius: 1.2
      reverse_penalty: 10.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      analytic_expansion_ratio: 3.5
      smooth_path: false

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: base_link
      robot_base_frame: base_link
      rolling_window: false
      width: 5
      height: 8
      resolution: 0.1
      origin_x: -0.6
      origin_y: -4.0
      track_unknown_space: true
      transform_tolerance: 0.1
      update_frequency: 10.0
      publish_frequency: 10.0
      always_send_full_costmap: true
      footprint: "[[0.40, 0.35], [0.40, -0.35], [-0.40, -0.35], [-0.40, 0.35]]"
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 1.5
        combination_method: 1
        observation_sources: L2_lidar_right L2_lidar_left
        L2_lidar_right:
          topic: /nav2_obstacle_points_right
          sensor_frame: ""
          data_type: PointCloud2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          obstacle_range: 4.0
          raytrace_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.15
          inf_is_valid: false
          marking: true
          clearing: true
        L2_lidar_left:
          topic: /nav2_obstacle_points_left
          sensor_frame: ""
          data_type: PointCloud2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          obstacle_range: 4.0
          raytrace_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.15
          inf_is_valid: false
          marking: true
          clearing: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

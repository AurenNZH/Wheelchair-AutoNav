/**:
  ros__parameters:
    operator_intent_topic: /operator_intent
    safety_envelope_topic: /safety_envelope
    merged_costmap_topic: /nav2_merged_costmap
    source_header_topic: /lidar_right/filter/source_header
    left_source_header_topic: /lidar_left/filter/source_header
    freshness_mode: nav2_live
    diagnostics_topic: /shared_control/diagnostics
    checked_corridor_topic: /shared_control/checked_corridor
    decision_rate_hz: 20.0
    max_intent_age_s: 0.20

    # Both gates remain false until physical calibration and elevated-wheel tests pass.
    enable_motion: false
    geometry_calibrated: false

    # The measured chair footprint is authoritative in Nav2's costmap config.
    stop_distance_m: 0.70
    slow_distance_m: 1.20
    min_turn_radius_m: 1.20
    # ROS lateral correction is left-positive. tan(30 degrees) = 0.5774.
    min_steering: -0.577350269
    max_steering: 0.577350269
    slow_forward_limit: 0.60
    reverse_limit: 0.65
    # Hard turns use a base-centred pixelated disc in the merged costmap.
    turn_clearance_radius_m: 0.55
    clear_turn_limit: 0.90
    slow_turn_limit: 0.60
    turn_longitudinal_limit: 0.15
    path_sample_step_m: 0.05
    steering_sample_step: 0.05
    neutral_deadzone: 0.05
    forward_cone_half_angle_deg: 30.0
    # Nav2 does not preserve sensor acquisition time in OccupancyGrid. Live
    # mode therefore gates map receipt and the filtered-source stamp separately.
    max_map_age_s: 0.50
    max_source_age_s: 0.50
    max_future_source_offset_s: 0.10
    # Foxy's OccupancyGrid conversion publishes inflated costs as 1..98,
    # inscribed collision cost as 99, and lethal obstacles as 100.
    slow_cost_threshold: 1
    stop_cost_threshold: 99

    # Planner assistance is opt-in twice: the supervisor must be in enforce
    # mode and each physical intent packet must advertise a non-zero authority.
    avoidance_mode: disabled
    avoidance_suggestion_topic: /shared_control/avoidance_suggestion
    avoidance_suggestion_max_age_s: 0.25
    avoidance_source_steering_tolerance: 0.05
    maximum_steering_assist: 0.15

    enable_udp: false
    bind_address: 0.0.0.0
    intent_port: 45450
    envelope_port: 45451
    pi_address: ""
    allowed_pi_address: ""

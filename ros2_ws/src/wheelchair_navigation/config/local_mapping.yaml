    resolution_m: 0.1
    min_height_m: 0.05
    max_height_m: 1.5
    min_range_m: 0.30
    max_range_m: 4.00
    # Forward planning layer in base_link +X.
    front_length_m: 4.0
    front_width_m: 8.0
    front_resolution_m: 0.1
    front_fov_deg: 180.0
    # Flat groups: [min_x, max_x, min_y, max_y, min_z, max_z] in base_link.
    # Provisional AIRY/footrest-mount exclusion volume, approved in RViz.
    # Keep zero padding so the effective filter exactly matches these bounds.
    self_filter_boxes: [0.0, 0.53, -0.465, 0.2, 0.32, 0.82]
    self_filter_padding_m: 0.0
    # Diagnostic shadow only. Shared control continues to consume /front_costmap.
    # Runtime output switches are launch-owned so ROS parameter selector
    # precedence cannot override the selected safety/debug profile.
    artifact_filter_frame: base_link
    # Flat groups: [region_id, forward_cell, lateral_cell, min_z, max_z].
    # XY indices refer directly to the 10 cm front costmap. The 76 records
    # form three visual regions. Z bounds retain the nearest/intersecting
    # legacy prism's measured band. Keep this shadow-only until recorded
    # obstacle gates pass.
    artifact_grid_mask_cells: [
      0.0, 5.0, -5.0, 0.350, 0.420,
      0.0, 5.0, -4.0, 0.350, 0.420,

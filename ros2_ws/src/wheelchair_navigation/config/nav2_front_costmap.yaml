costmap:
  costmap:
    ros__parameters:
      use_sim_time: false

      # Stock Foxy Costmap2D evaluation. This is a robot-relative obstacle
      # view, not a persistent world map: no physical odometry is available.
      global_frame: base_link
      robot_base_frame: base_link
      rolling_window: false
      # Foxy declares these two parameters as integers.
      width: 4
      height: 8
      resolution: 0.1
      origin_x: 0.0
      origin_y: -4.0
      track_unknown_space: false
      transform_tolerance: 0.1

      update_frequency: 10.0
      publish_frequency: 10.0
      always_send_full_costmap: true

      # Match the measured 0.80 m by 0.70 m base. This is the authoritative
      # footprint for the supervisor's weighted configuration-space policy.
      footprint: "[[0.40, 0.35], [0.40, -0.35], [-0.40, -0.35], [-0.40, 0.35]]"
      footprint_padding: 0.0

      # Keep Foxy's ObstacleLayer unmodified. The launch remaps this stable
      # right-sensor input to the raw point cloud selected by hardware
      # bring-up; filtering is not part of this baseline.
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        max_obstacle_height: 1.5
        combination_method: 1
        observation_sources: L2_lidar_right
        L2_lidar_right:
          topic: /nav2_obstacle_points_right
          sensor_frame: ""
          data_type: PointCloud2
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          obstacle_range: 4.0
          raytrace_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.15
          inf_is_valid: false
          marking: true
          clearing: true

      # Disabled unless nav2_mapping.launch.py receives use_inflation:=true.
      # These weights feed shadow CLEAR/SLOW/STOP decisions but remain
      # physically uncalibrated and must not enable enforcement.
      # Keep these keys flat so Foxy's RewrittenYaml can preserve their
      # bool/float types while applying launch-time substitutions.
      inflation_layer.plugin: "nav2_costmap_2d::InflationLayer"
      inflation_layer.enabled: false
      inflation_layer.inflation_radius: 0.55
      inflation_layer.cost_scaling_factor: 3.0
